name: CI Build   # Name of the workflow shown in GitHub Actions tab

on:
  push:           # Trigger workflow when code is pushed
    branches: [ main ]   # Only for 'main' branch
  pull_request:   # Also run when a pull request is created/updated

jobs:
  build: 
    runs-on: ubuntu-latest   # GitHub provides a fresh Ubuntu VM for this job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  
        # Downloads your repository into the runner so workflow can access files

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17        # Installs Java 17 on the VM
        # Required if your project uses Maven/Gradle or Java-based automation

      - name: Build with Maven
        run: mvn clean test       
        # Executes your automation tests or build commands

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: reports                     # Name of the artifact bundle
          path: target/surefire-reports/    # Folder to upload (TestNG/JUnit reports)
        # Makes test results downloadable from GitHub Actions UI
