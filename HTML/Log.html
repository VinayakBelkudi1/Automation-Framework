<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        .login-container {
            width: 300px;
            margin: 100px auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #888;
        }
        h2 {
            text-align: center;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>

    <script>
        function validateForm() {
            var username = document.forms["loginForm"]["username"].value;
            var password = document.forms["loginForm"]["password"].value;

            var usernamePattern = /^[A-Za-z]+$/;  // Only alphabets
            var passwordPattern = /^[0-9]+$/;     // Only numbers

            // Username alphabet check
            if (!usernamePattern.test(username)) {
                alert("Username should contain only alphabets (A-Z or a-z).");
                return false;
            }

            // Username length check
            if (username.length > 10) {
                alert("Username should not exceed 10 characters.");
                return false;
            }

            // Password numeric check
            if (!passwordPattern.test(password)) {
                alert("Password should contain only numbers (0-9).");
                return false;
            }

            alert("Login successful!");
            return true;
        }
    </script>
</head>

<body>
<div class="login-container">
    <h2>Login</h2>
    <form name="loginForm" onsubmit="return validateForm()">
        <label>Username:</label>
        <input type="text" name="username" maxlength="10" >

        <label>Password:</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
